version: "3.9"

services:
  db:
    image: postgres:16
    container_name: sovereign-ai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sovereign_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - ./drizzle:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sovereign_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
